name: Daily skew snapshot and morning sheet

on:
  schedule:
    # 22:15 UTC, Monday to Friday: after the US close, before Yahoo quotes go stale
    - cron: "15 22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/snapshot_skew.py
      - name: Build the morning sheet
        run: python scripts/build_sheet.py
      - name: Commit history and sheet
        run: |
          git config user.name "skew-bot"
          git config user.email "skew-bot@localhost"
          git add data/skew_history.csv sheet/latest.json
          git diff --cached --quiet || git commit -m "Skew snapshot and morning sheet $(date -u +%F)"
          git push
